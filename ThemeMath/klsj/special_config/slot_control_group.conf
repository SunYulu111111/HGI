# 按控制组配置奖励倍数阈值
[MAIN]
# 配置版本，变更后重新读取
version = 101
# 各控制组单次Spin砍分倍数阈值，0不砍分
control_group_cut_multiple = 5000,0,0,0,12000,0,0,0,1000,0,0,0,20,0,0,0,0,1000
# 各控制组单次免费Spin砍分倍数阈值，0不砍分
control_group_free_cut_multiple = 5000,0,0,0,12000,0,0,0,1000,0,0,0,20,0,0,0,0,1000

# 常规数值控制组
[CONTROL_GROUP_0]
# 标签用户控制组权重，最多20个
lable_user_control_group_rate = 10000
# 标签用户控制值：control_type*100+control_num，最多20个
lable_user_control_group_value = 1

