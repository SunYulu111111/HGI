#平台调控配置；独立机制仿真输出未经平台砍分的奖励。
[MAIN]
#配置文件版本，当版本改变时重新读取配置
version = 102
#下述每个Group中，（单次Spin）砍掉多少倍以上奖励(0不砍)
control_group_cut_multiple = 5000,0,0,0,12000,0,0,0,1000,0,0,0,20,0,0,0,0,1000
#免费按整轮累计逐手检查，升级为超级免费后继续累计；仅处理当前手，保留已结算奖励
control_group_free_cut_multiple = 5000,0,0,0,12000,0,0,0,1000,0,0,0,20,0,0,0,0,1000

