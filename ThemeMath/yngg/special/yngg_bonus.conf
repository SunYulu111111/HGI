[GENERAL]
# 通用Bonus配置。每个金色位置先按类型权重抽取类型，再按该类型的档位权重抽取具体结果。
# 档位数组与权重数组按相同下标一一对应；权重为相对权重，不要求总和为10000。

# JP固定倍数，顺序为MINI、MINOR、MAJOR、GRAND。
