# GRAND初始值。按BetScopes顺序配置，当前为5000倍JP，按BetScopes * BaseScore * 5000展开。
BONUS_GRAND_MULTI=5000

# 进入Bonus的概率。单位为万分比，对应旧JP触发概率。
BONUS_ENTER_RATE=95

